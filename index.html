<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saudi Tourism Guide | دليلك السياحي</title>
<meta name="description" content="اكتشف أهم الوجهات السياحية في المملكة العربية السعودية مع دليل سياحي تفاعلي شامل" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
<div class="bg-decoration"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- LANGUAGE BAR -->
<div class="lang-bar">
  <div class="lang-bar-inner" id="langBar">
    <button class="lang-btn active" data-lang="ar">🇸🇦 العربية</button>
    <button class="lang-btn" data-lang="en">🇬🇧 English</button>
    <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
    <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
    <button class="lang-btn" data-lang="ur">🇵🇰 اردو</button>
    <button class="lang-btn" data-lang="ru">🇷🇺 Русский</button>
  </div>
</div>
<div class="game-cta-banner">
  <div class="game-cta-inner">
    <span class="game-cta-text">🌿 <strong>جديد:</strong> لعبة السياحة البيئية التفاعلية — اكتشف المملكة وأجب على تحديات الاستدامة!</span>
    <a href="game/index.html" class="game-cta-btn">🎮 العب الآن</a>
  </div>
</div>
<header class="hero">
  <nav class="topbar">
    <div class="brand">Saudi Tourism Guide</div>
    <div class="topbar-badge">HTML • CSS • JavaScript</div>
  </nav>
  <div class="hero-content container">
    <div class="hero-text">
      <span class="section-pill" data-t="pill"></span>
      <h1 data-t="h1a"> <span data-t="h1b"></span></h1>
      <p data-t="heroP"></p>
      <div class="search-box">
        <label for="cityInput" data-t="searchLabel"></label>
        <div class="input-group">
          <input id="cityInput" type="text" data-t-placeholder="searchPlaceholder" />
          <button id="searchBtn" data-t="searchBtn"></button>
        </div>
        <small data-t="searchHint"></small>
      </div>
    </div>
    <div class="hero-stats">
      <div class="stat-card">
        <span class="stat-icon">🏙️</span>
        <strong id="citiesCount">6</strong>
        <span data-t="statCities"></span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">📍</span>
        <strong id="placesCount">24</strong>
        <span data-t="statPlaces"></span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">⚡</span>
        <strong>100%</strong>
        <span data-t="statInteractive"></span>
      </div>
    </div>
  </div>
</header>

<main class="container main-content">
  <!-- TABS -->
  <div class="main-tabs">
    <button class="tab-btn active" data-tab="explore" data-t="tabExplore"></button>
    <button class="tab-btn" data-tab="map" data-t="tabMap"></button>
    <button class="tab-btn" data-tab="favorites" data-t="tabFavorites"><span class="fav-count-badge" id="favBadge" style="display:none">0</span></button>
  </div>

  <!-- EXPLORE TAB -->
  <div class="tab-panel active" id="tab-explore">
    <section class="quick-cities">
      <h2 data-t="quickCities"></h2>
      <div class="chips" id="cityChips"></div>
    </section>
    <section class="results-header">
      <div>
        <h2 id="resultsTitle" data-t="resultsDefault"></h2>
        <p id="resultsSubtitle" data-t="resultsHint"></p>
      </div>
      <div class="filter-box">
        <label for="typeFilter" data-t="filterLabel"></label>
        <select id="typeFilter">
          <option value="all" data-t="filterAll"></option>
          <option value="مشهور" data-t="filterFamous"></option>
          <option value="جديد" data-t="filterNew"></option>
          <option value="طبيعة" data-t="filterNature"></option>
          <option value="تراث" data-t="filterHeritage"></option>
          <option value="فعاليات" data-t="filterEvents"></option>
          <option value="واجهة بحرية" data-t="filterSeafront"></option>
        </select>
      </div>
    </section>
    <section id="results" class="cards-grid"></section>
    <section id="emptyState" class="empty-state active">
      <div class="empty-icon">🏙️</div>
      <h3 data-t="emptyTitle"></h3>
      <p data-t="emptyHint"></p>
    </section>
  </div>

  <!-- MAP TAB -->
  <div class="tab-panel" id="tab-map">
    <div class="map-section">
      <div class="map-header">
        <h2 data-t="mapTitle"></h2>
        <p data-t="mapDesc"></p>
      </div>
      <div id="carbon-map"></div>
      <div class="carbon-info-box">
        <h4 data-t="carbonInfoTitle"></h4>
        <p data-t="carbonInfoDesc"></p>
      </div>
      <div class="map-legend" id="mapLegend">
        <strong style="color:var(--muted); font-size:0.88rem" data-t="legendTitle"></strong>
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div><span data-t="legendLow"></span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div><span data-t="legendMed"></span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div><span data-t="legendHigh"></span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div><span data-t="legendVHigh"></span></div>
      </div>
    </div>
  </div>

  <!-- FAVORITES TAB -->
  <div class="tab-panel" id="tab-favorites">
    <div id="favoritesGrid" class="cards-grid"></div>
    <div id="favoritesEmpty" class="favorites-empty">
      <div class="fav-empty-icon">🤍</div>
      <h3 data-t="favEmptyTitle"></h3>
      <p data-t="favEmptyHint"></p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer-content">
    <p data-t="footer1"></p>
    <p data-t="footer2"></p>
  </div>
</footer>

// Carbon data per city (hardcoded estimates in million tons CO₂)
const carbonData = {
  riyadh:  { lat: 24.688, lng: 46.722, co2: 7.2, color: "#ef4444", level: "vhigh" },
  jeddah:  { lat: 21.485, lng: 39.193, co2: 5.1, color: "#f97316", level: "high" },
  alula:   { lat: 26.613, lng: 37.921, co2: 0.8, color: "#22c55e", level: "low" },
  abha:    { lat: 18.216, lng: 42.507, co2: 1.4, color: "#eab308", level: "med" },
  taif:    { lat: 21.257, lng: 40.416, co2: 2.3, color: "#eab308", level: "med" },
  khobar:  { lat: 26.217, lng: 50.198, co2: 3.8, color: "#f97316", level: "high" }
};

const cityAliases = {
  "الرياض": "riyadh", "riyاض": "riyadh", "riyadh": "riyadh",
  "جدة": "jeddah", "jeddah": "jeddah",
  "العلا": "alula", "alula": "alula", "al ula": "alula",
  "abha": "abha", "أبها": "abha",
  "الطائف": "taif", "taif": "taif",
  "الخبر": "khobar", "khobar": "khobar"
};

// ==================== STATE ====================
let currentLang = "ar";
let currentCityKey = null;
let favorites = JSON.parse(localStorage.getItem("saudiTourFavorites") || "[]");
let mapInitialized = false;

// ==================== LANGUAGE ====================
function applyLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  // Update all data-t elements
  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.getAttribute("data-t");
    if (t[key] !== undefined) {
      // Preserve fav-count-badge
      const badge = el.querySelector(".fav-count-badge");
      el.textContent = t[key];
      if (badge) el.prepend(badge);
    }
  });
  document.querySelectorAll("[data-t-placeholder]").forEach(el => {
    const key = el.getAttribute("data-t-placeholder");
    if (t[key]) el.placeholder = t[key];
  });

  // Update filter options
  const filterOpts = document.querySelectorAll("#typeFilter option[data-t]");
  filterOpts.forEach(opt => {
    const key = opt.getAttribute("data-t");
    if (t[key]) opt.textContent = t[key];
  });

  // Active lang button
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });

  // Re-render if city selected
  if (currentCityKey) {
    const city = tourismData[currentCityKey];
    document.getElementById("resultsTitle").textContent =
      lang === "ar" ? `أبرز الوجهات السياحية في ${city.cityAr}` : `Top Tourist Destinations in ${city.cityEn}`;
    const n = city.places.length;
    document.getElementById("resultsSubtitle").textContent =
      (t.cityFound || "{n} places").replace("{n}", n);
    renderPlaces(currentCityKey);
  }
  renderFavorites();
}

// ==================== TABS ====================
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + tab).classList.add("active");

    if (tab === "map" && !mapInitialized) {
      setTimeout(initMap, 100);
      mapInitialized = true;
    }
    if (tab === "favorites") renderFavorites();
  });
});

// ==================== MAP ====================
function initMap() {
  const map = L.map("carbon-map", { center: [23.5, 44], zoom: 5, zoomControl: true });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '© OpenStreetMap © CartoDB',
    subdomains: "abcd", maxZoom: 19
  }).addTo(map);

  Object.entries(carbonData).forEach(([key, data]) => {
    const city = tourismData[key];
    const radius = 30000 + data.co2 * 18000;
    const circle = L.circle([data.lat, data.lng], {
      color: data.color, fillColor: data.color, fillOpacity: 0.35,
      weight: 2, radius
    }).addTo(map);

    const barWidth = Math.round((data.co2 / 8) * 100);
    circle.bindPopup(`
      <div class="popup-city">${city.cityEn} / ${city.cityAr}</div>
      <div class="popup-name">🌍 CO₂ Emissions</div>
      <div class="popup-carbon">${data.co2} million tons CO₂/year</div>
      <div class="popup-bar" style="background:linear-gradient(to right,${data.color},transparent);width:${barWidth}%"></div>
    `);

    L.marker([data.lat, data.lng], {
      icon: L.divIcon({
        className: "",
        html: `<div style="background:${data.color};color:#fff;font-weight:800;font-family:Cairo,sans-serif;padding:5px 10px;border-radius:999px;font-size:0.78rem;border:2px solid rgba(255,255,255,0.3);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.5)">${city.cityAr} · ${data.co2}Mt</div>`,
        iconAnchor: [40, 10]
      })
    }).addTo(map);
  });
}

// ==================== FAVORITES ====================
function saveFavorites() {
  localStorage.setItem("saudiTourFavorites", JSON.stringify(favorites));
  updateFavBadge();
}

function updateFavBadge() {
  const badge = document.getElementById("favBadge");
  if (favorites.length > 0) {
    badge.style.display = "inline-flex";
    badge.textContent = favorites.length;
  } else {
    badge.style.display = "none";
  }
}

function toggleFavorite(placeId) {
  const idx = favorites.indexOf(placeId);
  if (idx > -1) {
    favorites.splice(idx, 1);
  } else {
    favorites.push(placeId);
  }
  saveFavorites();

  // Update all fav buttons with this id
  document.querySelectorAll(`.fav-btn[data-id="${placeId}"]`).forEach(btn => {
    updateFavBtn(btn, favorites.includes(placeId));
  });

  // If on favorites tab, re-render
  if (document.getElementById("tab-favorites").classList.contains("active")) {
    renderFavorites();
  }
}

function updateFavBtn(btn, isActive) {
  const t = translations[currentLang];
  btn.classList.toggle("active", isActive);
  btn.textContent = isActive ? "❤️" : "🤍";
  btn.title = isActive ? (t.removeFav || "Remove from favorites") : (t.addFav || "Add to favorites");
}

function getAllPlaces() {
  const all = [];
  Object.values(tourismData).forEach(city => {
    city.places.forEach(place => all.push({ place, city }));
  });
  return all;
}

function renderFavorites() {
  const grid = document.getElementById("favoritesGrid");
  const empty = document.getElementById("favoritesEmpty");
  grid.innerHTML = "";

  const favPlaces = getAllPlaces().filter(({ place }) => favorites.includes(place.id));
  if (favPlaces.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  favPlaces.forEach(({ place, city }) => {
    grid.appendChild(createCard(place, city, false));
  });
}

// ==================== CARDS ====================
function createCard(place, city, showFavActive) {
  const isFav = favorites.includes(place.id);
  const t = translations[currentLang];
  const isAr = currentLang === "ar";
  const placeName = isAr ? place.name : (place.nameEn || place.name);
  const placeDesc = isAr ? place.description : (place.descriptionEn || place.description);

  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <div class="card-image">
      <img src="${place.image}" alt="${placeName}" loading="lazy">
      <div class="card-overlay"></div>
      <div class="card-tags">
        <span class="badge city">${isAr ? city.cityAr : city.cityEn}</span>
        <span class="badge type">${place.type}</span>
      </div>
      <button class="fav-btn ${isFav ? "active" : ""}" data-id="${place.id}" title="${isFav ? (t.removeFav || "") : (t.addFav || "")}">${isFav ? "❤️" : "🤍"}</button>
    </div>
    <div class="card-body">
      <h3 class="card-title">${placeName}</h3>
      <p class="card-description">${placeDesc}</p>
      <div class="sustainability-box">
        <h4>${t.sustainTitle || "🌱 Sustainability Tips"}</h4>
        <ul class="sustainability-list">
          ${place.sustainabilityTips.map(tip => `<li>${tip}</li>`).join("")}
        </ul>
      </div>
      <div class="card-footer">
        <a class="booking-link" href="${place.bookingUrl}" target="_blank" rel="noopener noreferrer">${t.bookNow || "Visit / Book"}</a>
        <span class="source-note">${t.source || "Source"}: ${place.source}</span>
      </div>
    </div>
  `;

  card.querySelector(".fav-btn").addEventListener("click", (e) => {
    e.preventDefault();
    toggleFavorite(place.id);
  });
  return card;
}

function renderPlaces(cityKey) {
  const selectedType = document.getElementById("typeFilter").value;
  const city = tourismData[cityKey];
  const t = translations[currentLang];
  let places = city.places;
  if (selectedType !== "all") places = places.filter(p => p.type === selectedType);

  const results = document.getElementById("results");
  const emptyState = document.getElementById("emptyState");
  results.innerHTML = "";

  if (!places.length) {
    emptyState.classList.add("active");
    emptyState.querySelector("h3").textContent = t.noResults || "No results";
    emptyState.querySelector("p").textContent = t.noResultsHint || "";
    return;
  }
  emptyState.classList.remove("active");
  places.forEach(place => results.appendChild(createCard(place, city)));
}

function searchCity() {
  const input = document.getElementById("cityInput").value;
  const cityKey = cityAliases[input.trim().toLowerCase()] || null;
  const t = translations[currentLang];

  if (!cityKey) {
    currentCityKey = null;
    document.getElementById("results").innerHTML = "";
    document.getElementById("resultsTitle").textContent = t.noCity || "City not supported";
    document.getElementById("resultsSubtitle").textContent = t.noCityHint || "";
    document.getElementById("emptyState").classList.add("active");
    document.getElementById("emptyState").querySelector("h3").textContent = t.emptyTitle || "";
    document.getElementById("emptyState").querySelector("p").textContent = t.emptyHint || "";
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    return;
  }

  currentCityKey = cityKey;
  const city = tourismData[cityKey];
  const isAr = currentLang === "ar";
  document.getElementById("resultsTitle").textContent =
    isAr ? `أبرز الوجهات السياحية في ${city.cityAr}` : `Top Tourist Destinations in ${city.cityEn}`;
  document.getElementById("resultsSubtitle").textContent =
    (t.cityFound || "{n} places found").replace("{n}", city.places.length);

  document.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("active", c.dataset.key === cityKey);
  });
  renderPlaces(cityKey);
}

// ==================== INIT ====================
function init() {
  const cityKeys = Object.keys(tourismData);
  const chips = document.getElementById("cityChips");
  cityKeys.forEach(key => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.key = key;
    btn.textContent = tourismData[key].cityAr;
    btn.addEventListener("click", () => {
      document.getElementById("cityInput").value = tourismData[key].cityAr;
      searchCity();
    });
    chips.appendChild(btn);
  });

  document.getElementById("searchBtn").addEventListener("click", searchCity);
  document.getElementById("cityInput").addEventListener("keydown", e => {
    if (e.key === "Enter") searchCity();
  });
  document.getElementById("typeFilter").addEventListener("change", () => {
    if (currentCityKey) renderPlaces(currentCityKey);
  });

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => applyLang(btn.dataset.lang));
  });

  const total = cityKeys.reduce((s, k) => s + tourismData[k].places.length, 0);
  document.getElementById("placesCount").textContent = total;
  document.getElementById("citiesCount").textContent = cityKeys.length;

  updateFavBadge();
  applyLang("ar");
}

init();
</script>
